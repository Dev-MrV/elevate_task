<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM Quant Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            emerald: '#10b981', // Neon emerald for up-trends
                            crimson: '#ef4444', // Crimson red for down-trends
                            cyan: '#06b6d4',    // Electric cyan for UI accents
                            slate: '#0f172a'    // Deep slate background
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans selection:bg-brand-cyan selection:text-white">

    <!-- Loading Spinner Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex-col items-center justify-center bg-gray-950/80 backdrop-blur-sm hidden">
        <div class="glass-spinner mb-4"></div>
        <p class="text-brand-cyan font-semibold tracking-widest uppercase text-sm animate-pulse">Running Quant Model...</p>
    </div>

    <!-- Main Dashboard Layout -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-80 bg-slate-900 border-r border-gray-800 flex flex-col shadow-2xl relative z-10">
            <div class="p-6 border-b border-gray-800 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-cyan to-blue-600 flex items-center justify-center shadow-lg shadow-brand-cyan/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Quant<span class="text-brand-cyan">Dash</span></h1>
            </div>
            
            <form id="predict-form" class="flex-1 overflow-y-auto p-6 space-y-8">
                <!-- Ticker Input -->
                <div class="space-y-2">
                    <label for="ticker" class="block text-xs font-medium text-gray-400 uppercase tracking-wider">Asset Ticker</label>
                    <div class="relative">
                        <input type="text" id="ticker" name="ticker" value="AAPL" required
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-transparent transition-all uppercase placeholder-gray-600 font-mono">
                    </div>
                </div>

                <!-- Lookback Slider -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label for="lookback" class="block text-xs font-medium text-gray-400 uppercase tracking-wider">Lookback Window</label>
                        <span id="lookback-val" class="text-xs font-mono text-brand-cyan bg-brand-cyan/10 px-2 py-0.5 rounded">60</span>
                    </div>
                    <input type="range" id="lookback" name="lookback" min="30" max="120" value="60" step="10"
                        class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-brand-cyan">
                </div>

                <!-- Epochs Slider -->
                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label for="epochs" class="block text-xs font-medium text-gray-400 uppercase tracking-wider">Training Epochs</label>
                        <span id="epochs-val" class="text-xs font-mono text-brand-cyan bg-brand-cyan/10 px-2 py-0.5 rounded">50</span>
                    </div>
                    <input type="range" id="epochs" name="epochs" min="10" max="100" value="50" step="10"
                        class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-brand-cyan">
                </div>
                
                <!-- Chart Toggles -->
                <div class="space-y-3 pt-4 border-t border-gray-800">
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider">Indicators</label>
                    
                    <label class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="toggle-sma" class="sr-only" checked>
                            <div class="block bg-gray-700 w-10 h-6 rounded-full transition-colors toggle-bg"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                        </div>
                        <div class="ml-3 text-sm font-medium text-gray-300">SMA 20/50</div>
                    </label>
                </div>
            </form>
            
            <div class="p-6 border-t border-gray-800 bg-slate-900/50">
                <button type="submit" form="predict-form" class="w-full relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-brand-cyan to-blue-600 rounded-lg blur opacity-60 group-hover:opacity-100 transition duration-200"></div>
                    <div class="relative w-full bg-gray-900 rounded-lg px-4 py-3 flex items-center justify-center transition-all group-hover:bg-gray-800">
                        <svg class="w-5 h-5 mr-2 text-brand-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="font-bold text-white tracking-wide">Execute Model</span>
                    </div>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-y-auto bg-gray-950">
            <!-- Header -->
            <header class="h-20 border-b border-gray-800 flex items-center justify-between px-8 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
                <div>
                    <h2 class="text-2xl font-light text-white">Market <span class="font-bold">Intelligence</span></h2>
                    <p class="text-sm text-gray-500" id="last-updated">Waiting for execution...</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-full px-4 py-1.5">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">System Online</span>
                    </div>
                </div>
            </header>

            <div class="p-8 space-y-8 max-w-screen-2xl mx-auto w-full">
                <!-- KPI Scoreboard -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <!-- Current Price -->
                    <div class="bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-lg relative overflow-hidden group hover:border-gray-700 transition-colors">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-gray-800 rounded-full blur-3xl -mr-10 -mt-10 opacity-50 group-hover:bg-blue-900/50 transition-colors"></div>
                        <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-2 relative z-10">Current Close</h3>
                        <div class="flex items-baseline gap-2 relative z-10">
                            <span class="text-3xl font-bold text-white" id="kpi-current-price">---</span>
                            <span class="text-sm text-gray-500">USD</span>
                        </div>
                    </div>

                    <!-- Predicted Price -->
                    <div class="bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-lg relative overflow-hidden group hover:border-gray-700 transition-colors">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-gray-800 rounded-full blur-3xl -mr-10 -mt-10 opacity-50 transition-colors" id="kpi-predicted-bg"></div>
                        <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-2 relative z-10">Predicted (T+1)</h3>
                        <div class="flex items-baseline gap-2 relative z-10">
                            <span class="text-3xl font-bold text-white" id="kpi-predicted-price">---</span>
                            <span class="text-sm font-semibold" id="kpi-price-change"></span>
                        </div>
                    </div>

                    <!-- Signal -->
                    <div class="bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-lg relative overflow-hidden flex flex-col justify-center items-center">
                        <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-3 absolute top-6 left-6">Action Signal</h3>
                        <div id="kpi-signal" class="mt-4 px-6 py-2 rounded-full font-black tracking-widest text-xl bg-gray-800 text-gray-500 border border-gray-700 uppercase">
                            STANDBY
                        </div>
                    </div>

                    <!-- Model Confidence (RMSE) -->
                    <div class="bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-lg relative overflow-hidden group hover:border-gray-700 transition-colors">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-gray-800 rounded-full blur-3xl -mr-10 -mt-10 opacity-50 transition-colors"></div>
                        <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-2 relative z-10">Model Accuracy</h3>
                        <div class="space-y-1 relative z-10">
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-gray-400">RMSE</span>
                                <span class="text-lg font-bold text-white font-mono" id="kpi-rmse">---</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm text-gray-400">MAPE</span>
                                <span class="text-lg font-bold text-white font-mono" id="kpi-mape">---</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Container -->
                <div class="space-y-6">
                    <!-- Main Price Chart -->
                    <div class="bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-medium text-white">Price Action & Forecast</h3>
                        </div>
                        <div id="main-chart" class="w-full h-[400px]"></div>
                    </div>

                    <!-- Subplot: RSI -->
                    <div class="bg-slate-900 border border-gray-800 rounded-2xl p-6 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider">RSI Oscillator (14)</h3>
                        </div>
                        <div id="rsi-chart" class="w-full h-[200px]"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Main Logic -->
    <script src="main.js"></script>
</body>
</html>
